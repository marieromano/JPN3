<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京都たびノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ffffff;
  --card:#ffffff;
  --yellow:#f7c544;
  --yellow-soft:#fdf1d2;
  --ink:#1f1f1f;
  --ink-soft:#5c5c5c;
  --ink-faint:#8c8c8c;
  --line:#e6e2d6;
  --green:#1d7a63;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#171613;
    --card:#221f19;
    --yellow:#f2bd3d;
    --yellow-soft:#3a2f14;
    --ink:#f2efe6;
    --ink-soft:#c7c0af;
    --ink-faint:#8f8878;
    --line:#3a352a;
    --green:#4fc6a8;
  }
}
:root[data-theme="dark"]{
  --page:#171613;
  --card:#221f19;
  --yellow:#f2bd3d;
  --yellow-soft:#3a2f14;
  --ink:#f2efe6;
  --ink-soft:#c7c0af;
  --ink-faint:#8f8878;
  --line:#3a352a;
  --green:#4fc6a8;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:"Noto Sans JP",Arial,Helvetica,sans-serif;
  line-height:1.6;
}
.wrap{max-width:640px;margin:0 auto;padding:0 0 48px;}
.topbar{
  background:var(--yellow);
  padding:22px 20px;
  text-align:center;
}
.topbar h1{margin:0;font-size:22px;font-weight:900;color:#2a2000;}
.topbar p{margin:4px 0 0;font-size:13px;color:#4a3a00;}
.setup-banner{
  background:#fde8e5;border-bottom:1px solid #e0b0a8;padding:10px 20px;
  font-size:12.5px;color:#7a2a1e;text-align:center;
}
.body-pad{padding:22px 20px 0;}
.section-label{
  display:inline-block;background:var(--yellow);color:#2a2000;
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px;margin-bottom:10px;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;}
h2{font-size:16px;margin:0 0 4px;font-weight:700;}
.sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin:10px 0 5px;font-weight:500;}
label:first-of-type{margin-top:0;}
input[type=text], textarea{
  width:100%;font-family:inherit;font-size:14.5px;padding:9px 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--page);color:var(--ink);
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--yellow);outline-offset:0;border-color:var(--yellow);}
textarea{min-height:80px;resize:vertical;}
input:disabled{color:var(--ink-faint);background:var(--yellow-soft);}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
button{
  font-family:inherit;font-size:14.5px;font-weight:700;padding:10px 18px;border-radius:7px;
  border:1px solid var(--yellow);cursor:pointer;background:var(--yellow);color:#2a2000;
}
button:hover{filter:brightness(0.96);}
button:active{filter:brightness(0.9);}
button.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
button:disabled{opacity:.5;cursor:not-allowed;}
.err{color:#b23b2e;font-size:12.5px;margin-top:6px;display:none;}
.hint{font-size:12px;color:var(--ink-faint);margin-top:8px;}
.charcount{font-size:11.5px;color:var(--ink-faint);text-align:right;margin-top:3px;}
.site-row{display:flex;gap:12px;align-items:center;}
.site-icon{font-size:34px;}
.site-name{font-weight:700;font-size:16px;margin:0;}
.site-fact{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}
.progress-line{font-size:12px;color:var(--ink-faint);margin:10px 0 4px;}
.trail{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px;}
.trail-item{
  font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--yellow-soft);opacity:.55;
}
.trail-item.now{background:var(--yellow);opacity:1;}
.advance-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.sample{border-left:3px solid var(--yellow);padding:8px 0 8px 12px;margin-bottom:12px;}
.sample:last-child{margin-bottom:0;}
.sample-meta{font-size:11.5px;color:var(--ink-faint);margin-bottom:2px;}
.sample-text{font-size:14px;color:var(--ink);}
.entry{padding:12px 0;border-top:1px solid var(--line);}
.entry:first-child{border-top:none;}
.entry-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:4px;}
.entry-date{font-size:11.5px;color:var(--ink-faint);}
.entry-name{font-weight:700;font-size:14px;}
.entry-comment{font-size:14.5px;white-space:pre-wrap;}
.empty-note{padding:14px 0;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.status-line{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
.badge-you{font-size:10.5px;background:var(--yellow);color:#2a2000;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:6px;}
.footer-note{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:6px;}
.footer-note a{color:var(--ink-faint);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (max-width:420px){ .row3{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <h1>京都たびノート</h1>
    <p>Visitor comment book — みんなで いっしょに 京都を たびしましょう</p>
  </div>
  <div id="setupBanner"></div>
  <p class="sr-only">Kyoto visitor comment book activity. Register your name, then the whole class visits the same famous Kyoto site together, reads two sample comments, and writes their own comment about it, before moving on to the next site together.</p>
  <div class="body-pad" id="content"></div>
</div>

<!--
  ============================================================
  SHARED / LIVE SYNC SETUP (plain JSON store via jsonbin.io)
  ============================================================
  This page stores its shared state (which site the class is on,
  and everyone's comments) as one plain JSON object on jsonbin.io
  -- a free service that just holds JSON and gives you a URL and
  an API key. No SDK, no login system, just fetch() calls.

  TO TURN ON LIVE SHARING (about 5 minutes, one-time):
  1. Go to https://jsonbin.io and create a free account.
  2. Open the "API Keys" page and copy your X-MASTER-KEY.
  3. Click "Create Bin" (the + button), and paste this starting
     JSON into it:
       { "sessionIndex": 0, "entries": {} }
     Save it. Copy the Bin ID shown in the URL / bin details
     (a long string of letters and numbers).
  4. Paste your Bin ID and Master Key into JSONBIN_CONFIG below.
  5. Commit and push to GitHub, turn on GitHub Pages, and share
     the link with your class.

  NOTES
  - This page checks for updates every few seconds (it "polls"),
    since plain JSON storage can't push updates instantly the way
    a database can -- so other students' comments may take a few
    seconds to appear. That's normal.
  - Your Master Key will be visible to anyone who views this
    page's source. That's fine for a short, low-stakes classroom
    activity, but don't reuse this bin/key for anything sensitive,
    and consider deleting the bin on jsonbin.io after class.
  - Until you fill in JSONBIN_CONFIG, the page still works, but
    each student's browser only remembers their own place and
    comments (no cross-student sharing) -- a banner will say so.
  ============================================================
-->
<script>
const JSONBIN_CONFIG = {
  binId: "6aa9b144ffd5d160530ba3c8",
  apiKey: "$2a$10$JXhZh0WUDMS5cZ/OAutFEuJJwIepRdmAsajdvZ87H71qWaxEMuiT."
};
const POLL_MS = 4000;

const SITES = [
  {id:'gosho', kanji:'京都御所', romaji:'Kyoto Gosho (Imperial Palace)', icon:'🏛️', century:null,
   fact:'昔、てんのうが すんでいた ところです。'},
  {id:'nijojo', kanji:'二条城', romaji:'Nijō Castle', icon:'🏯', century:17,
   fact:'かべに 3000まい いじょうの 絵が かかれています。'},
  {id:'ryoanji', kanji:'龍安寺（石庭）', romaji:'Ryōan-ji Rock Garden', icon:'🪨', century:15,
   fact:'石庭には 15こ の 石が あります。'},
  {id:'kinkakuji', kanji:'金閣寺（鹿苑寺）', romaji:'Kinkaku-ji (Golden Pavilion)', icon:'✨', century:14,
   fact:'やく20キロの 金が つかわれています。'},
  {id:'heian', kanji:'平安神宮', romaji:'Heian Jingū Shrine', icon:'⛩️', century:19,
   fact:'1895ねんに たてられました。大きい とりいが ゆうめいです。'},
  {id:'kiyomizu', kanji:'清水寺', romaji:'Kiyomizu-dera Temple', icon:'🌸', century:8,
   fact:'ぶたいには 柱が 139本 つかわれています。'},
  {id:'gion', kanji:'祇園', romaji:'Gion District', icon:'🎎', century:null,
   fact:'まいこさんの 町として よく しられています。'},
  {id:'shijo', kanji:'四条河原町', romaji:'Shijō-Kawaramachi', icon:'🏮', century:null,
   fact:'おみせが おおくて、いつも にぎやかです。'}
];

const SAMPLES = [
  {date:'10月31日', name:'小川', place:'大阪', text:'今日は 外国人の 友だちと 来ました。しずかで きもちが いい ところですね。つぎは 春に 来たいです。'},
  {date:'11月3日', name:'カタリーナ（ドイツ）', place:'ケルン', text:'外国から 来ました。この あたりは 日本てきで、とても きれいです。国の 友だちにも 見せたいです。'}
];

const LS_NAME='kyototabi_name';
let jsonbinReady=false;
let entries=[];
let sessionIndex=0, sessionReady=false;
let pollTimer=null;

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayParts(){
  const d=new Date();
  return {y:d.getFullYear(), m:d.getMonth()+1, day:d.getDate()};
}
function entryKeyFor(idx){ return 'kyototabi_entry_'+idx; }
function newId(){ return Date.now()+'_'+Math.random().toString(36).slice(2,8); }

function jsonbinConfigured(){
  return JSONBIN_CONFIG.binId && JSONBIN_CONFIG.binId !== 'YOUR_BIN_ID'
      && JSONBIN_CONFIG.apiKey && JSONBIN_CONFIG.apiKey !== 'YOUR_MASTER_KEY';
}

async function fetchBin(){
  const res = await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_CONFIG.binId+'/latest', {
    headers: { 'X-Master-Key': JSONBIN_CONFIG.apiKey, 'X-Bin-Meta': 'false' }
  });
  if(!res.ok) throw new Error('jsonbin read failed: '+res.status);
  const data = await res.json();
  if(typeof data.sessionIndex !== 'number') data.sessionIndex = 0;
  if(!data.entries || typeof data.entries !== 'object') data.entries = {};
  return data;
}

async function saveBin(data){
  const res = await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_CONFIG.binId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_CONFIG.apiKey },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('jsonbin write failed: '+res.status);
}

function render(){
  const name = localStorage.getItem(LS_NAME);
  const root = document.getElementById('content');
  if(!name){
    root.innerHTML = registerScreen();
    wireRegister();
  } else {
    root.innerHTML = mainScreen(name);
    wireMain(name);
  }
}

function registerScreen(){
  return `
  <div class="card">
    <span class="section-label">スタート</span>
    <h2>名前を 入力してください</h2>
    <p class="sub">クラス みんなで いっしょに 同じ ばしょを たびします。</p>
    <label for="nameInput">名前 / Name</label>
    <input type="text" id="nameInput" placeholder="たとえば：さくら" maxlength="40">
    <div class="err" id="nameErr">名前を 入力してください。</div>
    <div style="margin-top:14px;">
      <button id="joinBtn">さんかする</button>
    </div>
  </div>`;
}

function wireRegister(){
  const btn = document.getElementById('joinBtn');
  const input = document.getElementById('nameInput');
  const err = document.getElementById('nameErr');
  input.addEventListener('input', ()=>{ err.style.display='none'; });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });
  btn.addEventListener('click', ()=>{
    const v = input.value.trim();
    if(!v){ err.style.display='block'; return; }
    localStorage.setItem(LS_NAME, v);
    render();
  });
}

function mainScreen(name){
  const idx = Math.min(sessionIndex, SITES.length-1);
  const site = SITES[idx];
  const isLast = idx === SITES.length-1;
  const century = site.century ? `（${site.century}せいき）` : '';
  const entryId = localStorage.getItem(entryKeyFor(idx));
  const my = entries.find(e=>e.id===entryId);
  const t = todayParts();

  const samplesHtml = SAMPLES.map(s=>`
    <div class="sample">
      <div class="sample-meta">${esc(s.date)}　${esc(s.name)}　／　${esc(s.place)}</div>
      <div class="sample-text">${esc(s.text)}</div>
    </div>`).join('');

  const trailHtml = SITES.map((s,i)=>`<div class="trail-item${i===idx?' now':''}" title="${esc(s.kanji)}">${s.icon}</div>`).join('');

  const advanceBtn = isLast
    ? `<button class="secondary" id="advanceBtn">さいしょから もう一度</button>`
    : `<button id="advanceBtn">次の ばしょへ →</button>`;

  return `
  <div class="card">
    <span class="section-label">クラスの 今の ばしょ</span>
    <div class="progress-line">ばしょ ${idx+1} / ${SITES.length}</div>
    <div class="trail">${trailHtml}</div>
    <div class="site-row">
      <div class="site-icon" aria-hidden="true">${site.icon}</div>
      <div>
        <p class="site-name">${esc(site.kanji)} ${century}</p>
        <p class="site-fact">${esc(site.fact)}</p>
      </div>
    </div>
    <div class="advance-row">
      ${advanceBtn}
      <span class="hint" style="margin-top:0;">先生の 合図で つぎに すすみましょう。</span>
    </div>
  </div>

  <div class="card">
    <span class="section-label">Goal 37</span>
    <h2>コメントを 読みましょう</h2>
    <p class="sub">ほかの ばしょの コメントブックに、こんな コメントが ありました。</p>
    ${samplesHtml}
  </div>

  <div class="card">
    <span class="section-label">Goal 38</span>
    <h2>コメントを 書きましょう ${my?'<span class="badge-you">へんしゅう中</span>':''}</h2>
    <p class="sub">${esc(site.kanji)}について、みんなの コメントブックに 書いてください。</p>
    <label>月日 / Date</label>
    <div class="row3">
      <input type="text" id="fYear" placeholder="年" value="${my?my.year:t.y}">
      <input type="text" id="fMonth" placeholder="月" value="${my?my.month:t.m}">
      <input type="text" id="fDay" placeholder="日" value="${my?my.day:t.day}">
    </div>
    <label>名前 / Name</label>
    <input type="text" id="fName" value="${esc(name)}" disabled>
    <label>場所 / Place</label>
    <input type="text" id="fSite" value="${esc(site.kanji)}" disabled>
    <label for="fComment">コメント / Comment</label>
    <textarea id="fComment" maxlength="200" placeholder="この あたりは...">${my?esc(my.comment):''}</textarea>
    <div class="charcount"><span id="ccount">0</span> / 200</div>
    <div class="err" id="formErr">コメントを 書いてください。</div>
    <p class="hint">ヒント：〜によって／〜として／〜(ら)れています／〜たことがあります を つかってみましょう。</p>
    <div style="margin-top:14px;">
      <button id="submitBtn">${my?'こうしんする':'ノートに 書く'}</button>
    </div>
    <div id="successMsg" style="display:none;margin-top:10px;font-size:13px;color:var(--green);font-weight:700;">書きました。ありがとう！</div>
  </div>

  <div class="card" id="notebookWrap">
    <span class="section-label">みんなの コメントブック — ${esc(site.kanji)}</span>
    <div class="status-line" id="statusLine"></div>
    <div id="entryList"></div>
  </div>
  <p class="footer-note">${esc(name)}さん、ようこそ！ <a href="#" id="resetLink">名前を かえる</a></p>
  `;
}

function wireMain(name){
  const idx = Math.min(sessionIndex, SITES.length-1);
  const site = SITES[idx];

  const comment = document.getElementById('fComment');
  const ccount = document.getElementById('ccount');
  const updateCount = ()=>{ ccount.textContent = comment.value.length; };
  comment.addEventListener('input', updateCount);
  updateCount();

  document.getElementById('advanceBtn').addEventListener('click', async ()=>{
    const isLast = idx === SITES.length-1;
    const nextIndex = isLast ? 0 : idx+1;
    const btn = document.getElementById('advanceBtn');
    btn.disabled = true;
    if(jsonbinReady){
      try{
        const remote = await fetchBin();
        remote.sessionIndex = nextIndex;
        await saveBin(remote);
        sessionIndex = nextIndex;
        entries = remote.entries[String(nextIndex)] || [];
      } catch(e){ /* ignore, will resync on next poll */ }
    } else {
      sessionIndex = nextIndex;
      localStorage.setItem('kyototabi_session_index', String(nextIndex));
      loadLocalEntries();
    }
    render();
  });

  document.getElementById('resetLink').addEventListener('click', (e)=>{
    e.preventDefault();
    if(confirm('名前を かえますか？（コメントブックは のこります）')){
      localStorage.removeItem(LS_NAME);
      render();
    }
  });

  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    const err = document.getElementById('formErr');
    const val = comment.value.trim();
    if(!val){ err.style.display='block'; return; }
    err.style.display='none';
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const key = entryKeyFor(idx);
    const existingId = localStorage.getItem(key);
    const id = existingId || newId();
    const data = {
      id: id,
      name: name,
      site: site.kanji,
      year: document.getElementById('fYear').value.trim(),
      month: document.getElementById('fMonth').value.trim(),
      day: document.getElementById('fDay').value.trim(),
      comment: val,
      ts: Date.now()
    };
    try{
      if(jsonbinReady){
        const remote = await fetchBin();
        const list = remote.entries[String(idx)] || [];
        const pos = list.findIndex(e=>e.id===id);
        if(pos>=0){ list[pos] = data; } else { list.push(data); }
        remote.entries[String(idx)] = list;
        await saveBin(remote);
        entries = list;
        localStorage.setItem(key, id);
      } else {
        data.siteIndex = idx;
        entries = entries.filter(e=>e.id!==id);
        entries.push(data);
        localStorage.setItem(key, id);
        localStorage.setItem('kyototabi_local_entries', JSON.stringify(entries));
      }
      renderNotebook();
      const msg = document.getElementById('successMsg');
      msg.style.display='block';
      setTimeout(()=>{ render(); }, 800);
    } catch(e){
      err.textContent = 'エラーが おきました。もう一度 やってください。';
      err.style.display='block';
    } finally {
      btn.disabled = false;
    }
  });

  renderNotebook();
}

function renderNotebook(){
  const listEl = document.getElementById('entryList');
  const statusEl = document.getElementById('statusLine');
  if(!listEl) return;

  if(jsonbinReady){
    statusEl.textContent = `${entries.length}人が この ばしょについて 書きました。（すう秒ごとに こうしん）`;
  } else {
    statusEl.textContent = '自分の コメントだけ 見えます（共有せっていが まだです）。';
  }

  if(entries.length===0){
    listEl.innerHTML = `<div class="empty-note">まだ コメントが ありません。さいしょの 一人に なりましょう！</div>`;
    return;
  }
  const sorted = [...entries].sort((a,b)=>(b.ts||0)-(a.ts||0));
  const idx = Math.min(sessionIndex, SITES.length-1);
  const myId = localStorage.getItem(entryKeyFor(idx));
  listEl.innerHTML = sorted.map(e=>{
    const dateStr = [e.year,e.month,e.day].filter(Boolean).join('/');
    const mine = e.id===myId ? '<span class="badge-you">あなた</span>' : '';
    return `<div class="entry">
      <div class="entry-meta">
        <span class="entry-date">${esc(dateStr)}</span>
        <span class="entry-name">${esc(e.name)}${mine}</span>
      </div>
      <div class="entry-comment">${esc(e.comment)}</div>
    </div>`;
  }).join('');
}

function loadLocalEntries(){
  try{
    const all = JSON.parse(localStorage.getItem('kyototabi_local_entries')||'[]');
    entries = all.filter(e=>e.siteIndex===sessionIndex);
  } catch(e){ entries = []; }
}

function showSetupBanner(show){
  const el = document.getElementById('setupBanner');
  el.innerHTML = show
    ? '<div class="setup-banner">共有ノートは まだ せっていされていません。せんせいへ：ファイルの上の方にある JSONBIN_CONFIG を せっていしてください。今は 自分の コメントだけ 見えます。</div>'
    : '';
}

async function pollLoop(){
  try{
    const remote = await fetchBin();
    const newIndex = remote.sessionIndex;
    if(newIndex !== sessionIndex || !sessionReady){
      sessionIndex = newIndex;
      sessionReady = true;
      entries = remote.entries[String(sessionIndex)] || [];
      render();
    } else {
      entries = remote.entries[String(sessionIndex)] || [];
      renderNotebook();
    }
  } catch(e){
    /* transient network issue -- try again next poll */
  }
}

async function initApp(){
  if(!jsonbinConfigured()){
    jsonbinReady = false;
    showSetupBanner(true);
    sessionReady = true;
    const stored = parseInt(localStorage.getItem('kyototabi_session_index')||'0', 10);
    sessionIndex = isNaN(stored) ? 0 : stored;
    loadLocalEntries();
    render();
    return;
  }
  try{
    const remote = await fetchBin();
    sessionIndex = remote.sessionIndex;
    entries = remote.entries[String(sessionIndex)] || [];
    jsonbinReady = true;
    sessionReady = true;
    showSetupBanner(false);
    render();
    pollTimer = setInterval(pollLoop, POLL_MS);
  } catch(e){
    jsonbinReady = false;
    showSetupBanner(true);
    sessionReady = true;
    const stored = parseInt(localStorage.getItem('kyototabi_session_index')||'0', 10);
    sessionIndex = isNaN(stored) ? 0 : stored;
    loadLocalEntries();
    render();
  }
}

initApp();
</script>
</body>
</html>
